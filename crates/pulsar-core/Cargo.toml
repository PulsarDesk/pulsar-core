[package]
name = "pulsar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Pulsar desktop core — connection orchestration (P2P + relay fallback), E2E crypto, controller input, and the streaming pipeline. Consumed by the Tauri app."

[dependencies]
pulsar-proto.workspace = true
tokio.workspace = true
socket2.workspace = true
# Enumerate every local IPv4 interface so LAN discovery joins/sends the multicast group
# on ALL real NICs — a multi-homed host (Ethernet + WiFi) can receive a peer's beacon on
# a different NIC than its default route, so a single-interface join silently misses peers.
if-addrs = "0.15"
whoami.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
x25519-dalek = { workspace = true, features = ["static_secrets"] }
chacha20poly1305.workspace = true
sha2.workspace = true
# PAKE session auth (service/pake.rs): the one-time / connect password is proven with
# SPAKE2 and never travels, not even inside the encrypted session. hmac = key confirmation.
spake2 = { version = "0.4", features = ["getrandom"] }
hmac = "0.13"
# Host 2FA (TOTP, RFC 6238) — HMAC-SHA1 is what authenticator apps compute.
sha1 = "0.11"
# gilrs removed: controller reading + rumble are via SDL3 (sdl3-sys) in the app crate.
# Reed-Solomon erasure coding for the media FEC parity (adaptive streaming Phase 2.1):
# per video frame, `m` parity packets let the client rebuild up to `m` lost packets with
# zero round-trips (the Sunshine/Moonlight/Parsec approach). Pure Rust, every target.
reed-solomon-erasure = { version = "6", default-features = false, features = ["std"] }

# Host-side virtual gamepad injection on Linux (uinput) + Wayland screen capture
# via the XDG ScreenCast desktop portal (x11grab can't see a Wayland desktop).
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
libc = "0.2"
# In-process GStreamer for the Wayland (portal → PipeWire) host capture: the pipeline
# runs inside the app so the encoder's bitrate changes live and keyframes can be forced
# on request — no `gst-launch` child, no restart (which re-opened the portal and used to
# leave a black screen). Needs libgstreamer1.0-dev + gstreamer-plugins-base at build time.
gstreamer = "0.25"
gstreamer-video = "0.25"
# Wayland output layout (xdg-output logical geometry): the compositor spreads the absolute
# uinput pointer over the bounding box of ALL outputs, so the host needs the layout to keep
# a client's 0..1 pointer on the one monitor it is streaming.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
# Per-window capture on X11 (window_capture/x11.rs): list the WM's client windows with their
# titles / pids / sizes. Pure-Rust protocol (RustConnection) — no libX11/libxcb link.
# `randr`: the monitor a window sits on, for fitting it to a split pane (window_capture::fit).
x11rb = { version = "0.13", default-features = false, features = ["randr"] }

# Host-side mouse + keyboard injection on Windows via the Win32 SendInput API
# (global desktop), plus PostMessage-based per-WINDOW input (Phase 3B co-op:
# Win32_Foundation = HWND/WPARAM/LPARAM, Win32_UI_WindowsAndMessaging =
# PostMessageW + the WM_* window-message constants).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Input_Pointer", # InjectTouchInput: real two-finger pinch on the host
	"Win32_UI_Input_XboxController", # vigem.rs: find a virtual pad's real XInput slot (co-op)
	"Win32_UI_WindowsAndMessaging",
	"Win32_Foundation",
	# ClientToScreen (maps the cached client point → screen coords for WM_MOUSEWHEEL,
	# whose lParam is documented as screen-relative).
	"Win32_Graphics_Gdi",
	# GetBestRoute: the default gateway, asked for a NAT-PMP port mapping (connection/portmap.rs).
	"Win32_NetworkManagement_IpHelper",
	# netwatch.rs: NotifyIpInterfaceChange's MIB_IPINTERFACE_ROW carries a NET_LUID.
	"Win32_NetworkManagement_Ndis",
	"Win32_Networking_WinSock",
	# input/duo.rs: load Duo's DuoController.dll, find its install dir + HID-isolation flag,
	# tell a Duo/RDP seat from the console session.
	"Win32_System_LibraryLoader",
	"Win32_System_Registry",
	"Win32_System_RemoteDesktop",
	# input/duo.rs DualSense: find the Duo pad's devnode (SetupDi + CM_Get_Parent) and read
	# its shared output section (OpenFileMappingW/MapViewOfFile, OpenEventW/WaitForSingleObject).
	"Win32_Devices_DeviceAndDriverInstallation",
	"Win32_System_Memory",
	"Win32_System_Threading",
	# input/pad_cleanup.rs: remove a dead Pulsar's leftover pads (DIF_REMOVE, process probe)
	# and keep their record in an admin-only %ProgramData%\Pulsar file (SDDL, owner check,
	# SHGetKnownFolderPath).
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_Storage_FileSystem",
	"Win32_System_Com",
	"Win32_UI_Shell",
] }
# Host-side virtual gamepad on Windows: emulates an Xbox 360 pad through the
# ViGEmBus driver (pure-Rust client; the driver itself is bundled like Interception).
vigem-client = { version = "0.1", features = ["unstable_ds4"] }
# note: unstable_ds4 is an unstable vigem-client feature, pinned via Cargo.lock 0.1.4
# Core Audio (IAudioEndpointVolume) for muting the host's local output while
# streaming; the higher-level `windows` crate gives the COM methods windows-sys lacks.
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_System_Com",
	# IMMDevice::Activate is gated on both of these (its PROPVARIANT param).
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Variant",
	"Win32_Media_Audio",
	"Win32_Media_Audio_Endpoints",
	# Per-process WASAPI loopback (Phase 4 same-host co-op): ActivateAudioInterfaceAsync
	# + the async completion event (CreateEventW/SetEvent/WaitForSingleObject) and
	# RtlGetVersion to gate it to Win10 20H1+ (build 19041) at runtime.
	"Win32_System_Threading",
	"Win32_System_SystemInformation",
	# CreateEventW's signature references SECURITY_ATTRIBUTES, so it is gated behind this.
	"Win32_Security",
	# RtlGetVersion (ntdll) — the UN-shimmed OS build query (GetVersionExW lies without a
	# compatibility manifest). Lives under Wdk in windows-rs; OSVERSIONINFOW comes from
	# Win32_System_SystemInformation above.
	"Wdk_System_SystemServices",
] }
# The IActivateAudioInterfaceCompletionHandler COM object is built with
# `#[windows::core::implement]`, whose generated code references the `windows_core` crate by
# its absolute path (`::windows_core::…`), so it must be a DIRECT dependency. Pinned to the
# same 0.62 line as `windows` (which re-exports it as `windows::core`).
windows-core = "0.62"

# Host-side mouse + keyboard injection on macOS via CoreGraphics CGEvent — the
# standard user-mode synthetic-input path (same as Parsec/VNC/RustDesk). Requires
# the Accessibility (TCC) grant at runtime, or posted events silently no-op; see
# input/macos.rs. core-foundation is core-graphics' base layer (pinned for CF types).
[target.'cfg(target_os = "macos")'.dependencies]
# "highsierra" gates CGEvent::new_scroll_event (CGEventCreateScrollWheelEvent2);
# our min macOS is well past 10.13, so it's always available.
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"
# netwatch.rs: the PF_ROUTE socket that reports address / interface changes.
# window_capture.rs: proc_listchildpids (a launched game's child processes).
libc = "0.2"
# Per-window host capture (window_capture/mac.rs): ScreenCaptureKit lists the windows and
# streams one (SCContentFilter desktopIndependentWindow) as NV12 CVPixelBuffers.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSArray", "NSEnumerator", "NSString", "NSError"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "objc2-core-graphics", "objc2-core-foundation", "libc", "SCShareableContent", "SCStream", "SCError"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "objc2-core-video", "CMSampleBuffer", "CMTime", "CMBase"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
block2 = "0.6"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "alloc", "objc2"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros", "time", "net", "sync"] }
pulsar-relay.workspace = true

# Diagnostic-only: the kbdhook_smoke test probes whether WH_KEYBOARD_LL fires here.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_UI_WindowsAndMessaging",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_System_Threading",
	"Win32_System_LibraryLoader",
] }
