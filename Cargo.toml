# Pulsar core — shared Rust workspace (client/host/streaming core).
#
# Extracted from the Pulsar monorepo. This is the engine both apps depend on
# (git dependency): PulsarDesk/pulsar-desktop and PulsarDesk/pulsar-mobile.
# The shared wire protocol + relay live in their own repos (git deps too).
#
# vigem-client is a vendored fork (0.1.4 + DS4 EXTENDED report) that pulsar-core
# uses on Windows via [patch.crates-io]. It is NOT a workspace member (Windows-only
# code would fail to compile on other hosts) — it is only pulled in on `cfg(windows)`.
[workspace]
resolver = "2"
members = ["crates/pulsar-core"]
default-members = ["crates/pulsar-core"]

[workspace.package]
version = "0.1.0-dev.27"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Pulsar contributors"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
bincode = "1.3"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
socket2 = { version = "0.5", features = ["all"] }
whoami = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = "2"
chacha20poly1305 = "0.10"
sha2 = "0.10"
gilrs = "0.10"
# Shared crates, now external repos (git dependencies).
pulsar-proto = { git = "https://github.com/PulsarDesk/pulsar-proto" }
pulsar-relay = { git = "https://github.com/PulsarDesk/relay" }

# Vendored vigem-client (0.1.4) with the DS4 EXTENDED report (DS4_REPORT_EX +
# update_ex + IOCTL_DS4_SUBMIT_REPORT_EX) that ViGEmBus needs to surface the PS
# button / touchpad (matches Sunshine). Applied by consumers too (desktop/mobile
# patch it via git to this repo).
[patch.crates-io]
vigem-client = { path = "crates/vigem-client" }
