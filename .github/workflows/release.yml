name: Release

# Cut from `main`. semantic-release computes the next version from Conventional
# Commits and creates a git TAG + GitHub Release only — never a commit back to the
# repo. pulsar-core is a library, so there are no build artifacts to attach.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: semantic-release (tag + GitHub release)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux deps (gilrs → libudev)
        run: |
          sudo apt-get update
          # GitHub's ubuntu-22.04 image ships libunwind-14-dev, which conflicts with the
          # libunwind-dev that libgstreamer1.0-dev depends on ("held broken packages").
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libudev-dev build-essential libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test gate
        run: cargo test --locked
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits@^9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
