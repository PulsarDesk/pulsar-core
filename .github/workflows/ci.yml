name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Headless core tests on every target OS + arch (incl. ARM Linux for OrangePi /
  # Raspberry Pi). pulsar-proto/-relay come from git; vigem-client (Windows) via patch.
  rust:
    name: Rust · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     name: linux-x64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: windows-latest,   name: windows-x64 }
          - { os: macos-latest,     name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps (libudev for uinput/evdev)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          # GitHub's ubuntu-22.04 image ships libunwind-14-dev, which conflicts with the
          # libunwind-dev that libgstreamer1.0-dev depends on ("held broken packages").
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libudev-dev build-essential libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: rustfmt (advisory)
        if: matrix.name == 'linux-x64'
        continue-on-error: true
        run: cargo fmt --all --check
      - name: clippy (advisory)
        if: matrix.name == 'linux-x64'
        continue-on-error: true
        run: cargo clippy -p pulsar-core --all-targets --locked
      - name: Test
        run: cargo test --locked

  audit:
    name: Security audit (RustSec)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write # audit-check posts its result as a check run
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
